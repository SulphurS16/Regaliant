[package]
name = "dsport"
version.workspace = true
description = "Regaliant's runtime: Demon's Souls (PS5, PPSA01341) on Windows x86-64, PS5 HLE + native CPU execution (shipped as regaliant.exe)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dsport"
path = "src/main.rs"

[dependencies]
sce-elf = { path = "../sce-elf" }
dsconfig = { path = "../dsconfig" }
rdna = { path = "../rdna" }
rspirv = "0.13"
parking_lot = "0.12"
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }
miniz_oxide = "0.8"
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "fast_fmt", "code_asm"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Environment",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Input",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_Devices_Display",
    "Win32_System_Power",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_IO",
] }

[target.'cfg(target_os = "linux")'.dependencies]
serde = { version = "1", features = ["derive"] }
libc = "0.2"
fontdue = "0.9"
sdl3 = { version = "0.22", features = ["ash", "use-pkg-config"] }
